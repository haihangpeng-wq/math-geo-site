<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="36" height="36" rx="8" fill="#3b4f6e"/>
  <!-- 直角坐标系 -->
  <line x1="6" y1="28" x2="30" y2="28" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="6" y1="28" x2="6" y2="6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 箭头 -->
  <polyline points="28,26.5 30,28 28,29.5" fill="none" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
  <polyline points="4.5,8 6,6 7.5,8" fill="none" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- 点 -->
  <circle cx="22" cy="12" r="2" fill="#8aa4c8"/>
  <!-- 虚线投影 -->
  <line x1="22" y1="28" x2="22" y2="12" stroke="#8aa4c8" stroke-width="0.9" stroke-dasharray="2,1.5"/>
  <line x1="6" y1="12" x2="22" y2="12" stroke="#8aa4c8" stroke-width="0.9" stroke-dasharray="2,1.5"/>
</svg>
